services:
  api:
    build: .
    image: ai-operating-system:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_OS_DATABASE_URL: sqlite:////data/ai_os.db
    ports:
      - "8000:8000"
    volumes:
      - aios-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: ai-operating-system:local
    build: .
    restart: unless-stopped
    command: ["python", "-m", "ai_os.worker_service"]
    env_file:
      - .env
    environment:
      AI_OS_DATABASE_URL: sqlite:////data/ai_os.db
    volumes:
      - aios-data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  aios-data:
