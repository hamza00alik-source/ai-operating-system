name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q

  video-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run video queue, provider isolation, and worker protocol tests
        run: >-
          python -m pytest -q
          tests/test_video_jobs.py
          tests/test_video_provider_routing.py
          tests/test_video_worker_auth.py
          tests/test_video_worker_artifacts.py
          tests/test_video_worker_protocol.py
          tests/test_cinecode_worker.py
          tests/test_owner_session_auth.py
