name: OpenCompany Core Tests

on:
  push:
    branches: [main]
    paths:
      - "src/opencompany_core/**"
      - "tests/test_asset_*.py"
      - "tests/test_business_assets.py"
      - ".github/workflows/opencompany-core-tests.yml"
  pull_request:
    paths:
      - "src/opencompany_core/**"
      - "tests/test_asset_*.py"
      - "tests/test_business_assets.py"
      - ".github/workflows/opencompany-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test private asset and business core
        run: pytest -q tests/test_asset_storage.py tests/test_asset_scanning.py tests/test_business_assets.py
