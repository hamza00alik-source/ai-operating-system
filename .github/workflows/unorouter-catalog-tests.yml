name: UnoRouter free catalogue tests

on:
  push:
    branches:
      - feat/unorouter-free-catalog
  pull_request:
    branches:
      - fix/release-hardening

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run UnoRouter and gateway tests
        run: python -m pytest -q tests/test_unorouter_adapter.py tests/test_unorouter_catalog.py
