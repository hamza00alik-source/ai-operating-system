name: dependency-evidence

on:
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application, test and inventory tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install cyclonedx-bom pip-licenses pip-tools
      - name: Generate dependency evidence
        run: |
          mkdir -p dependency-evidence
          # Keep the full CI inventory, including development and evidence tooling.
          cyclonedx-py environment --output-format JSON --output-file dependency-evidence/ci-environment.cdx.json
          pip-licenses --format=csv --with-urls --with-description --output-file=dependency-evidence/ci-environment-licenses.csv
          python -m pip freeze --all > dependency-evidence/ci-environment-freeze.txt
          # Separately resolve only the project's declared runtime dependencies.
          pip-compile --resolver=backtracking --strip-extras --output-file=dependency-evidence/application-requirements.lock.txt pyproject.toml
          cyclonedx-py requirements dependency-evidence/application-requirements.lock.txt --output-format JSON --output-file dependency-evidence/application-runtime.cdx.json
          cat > dependency-evidence/README.txt <<'EOF'
          Generated by the dependency-evidence GitHub Actions workflow.
          ci-environment.* inventories the complete CI environment, including
          application, development and inventory tooling.
          application-requirements.lock.txt and application-runtime.cdx.json
          separately cover resolved direct/transitive Python runtime packages
          declared by pyproject.toml. This is a time-specific resolution, not
          a legal determination. Review package licenses, notices, transitive
          dependencies and policy exceptions before release.
          Re-run the workflow to refresh this time-specific evidence.
          EOF
      - name: Upload dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence-${{ github.sha }}
          path: dependency-evidence/
          if-no-files-found: error
          retention-days: 30
