name: dependency-evidence

on:
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application, test and inventory tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install cyclonedx-bom pip-licenses
      - name: Generate dependency evidence
        run: |
          mkdir -p dependency-evidence
          cyclonedx-py environment --output-format JSON --output-file dependency-evidence/ci-environment.cdx.json
          pip-licenses --format=csv --with-urls --with-description --output-file=dependency-evidence/ci-environment-licenses.csv
          python -m pip freeze --all > dependency-evidence/ci-environment-freeze.txt
          cat > dependency-evidence/README.txt <<'EOF'
          Generated by the dependency-evidence GitHub Actions workflow.
          These files inventory the complete CI Python environment, including
          application dependencies, development dependencies, and the
          CycloneDX/pip-licenses inventory tools. They are not an application-
          only lockfile or a legal determination that every package is cleared
          for every distribution model. Review package licenses, notices,
          transitive dependencies, and any policy exceptions before release.
          Re-run the workflow to refresh this time-specific environment record.
          EOF
      - name: Upload dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence-${{ github.sha }}
          path: dependency-evidence/
          if-no-files-found: error
          retention-days: 30
