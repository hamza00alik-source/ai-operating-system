name: creator-clipping-tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ai_os/clipping.py"
      - "src/ai_os/video_jobs.py"
      - "src/ai_os/api.py"
      - "workers/creator_clipping_worker.py"
      - "tests/test_clipping_engine.py"
      - "tests/test_video_jobs.py"
      - "docs/CREATOR_CLIPPING.md"
      - ".github/workflows/creator-clipping-tests.yml"
  push:
    branches: ["feature/creator-clipping-mvp"]
    paths:
      - "src/ai_os/clipping.py"
      - "src/ai_os/video_jobs.py"
      - "src/ai_os/api.py"
      - "workers/creator_clipping_worker.py"
      - "tests/test_clipping_engine.py"
      - "tests/test_video_jobs.py"
      - ".github/workflows/creator-clipping-tests.yml"
  workflow_dispatch:

jobs:
  clipping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m py_compile src/ai_os/clipping.py workers/creator_clipping_worker.py\n      - run: pytest -q tests/test_clipping_engine.py tests/test_video_jobs.py
