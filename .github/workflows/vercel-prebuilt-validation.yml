name: Vercel prebuilt build validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-prebuilt-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test AIOS
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

  vercel-prebuild:
    name: Build Vercel output (no deployment)
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: "65.14.0"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check optional Vercel credentials
        id: credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped Vercel build
        if: steps.credentials.outputs.configured != 'true'
        run: |
          {
            echo "### Vercel prebuild skipped"
            echo "Configure the repository secret `VERCEL_TOKEN` and variables `VERCEL_ORG_ID` and `VERCEL_PROJECT_ID`, then rerun this workflow."
            echo "No credentials were requested in chat and no deployment was attempted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Vercel CLI
        if: steps.credentials.outputs.configured == 'true'
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull preview project configuration
        if: steps.credentials.outputs.configured == 'true'
        run: vercel pull --yes --environment=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build locally using Vercel Build Output API
        if: steps.credentials.outputs.configured == 'true'
        run: |
          vercel build
          test -s .vercel/output/config.json

      - name: Upload prebuilt output for owner review
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vercel-prebuilt-${{ github.sha }}
          path: .vercel/output/
          if-no-files-found: error
          retention-days: 7

      - name: Record build-only safety boundary
        if: steps.credentials.outputs.configured == 'true'
        run: |
          {
            echo "### Vercel prebuild complete"
            echo "The Build Output API artifact was created and retained for 7 days."
            echo "This workflow did not run `vercel deploy`, assign domains, promote a deployment, or change production."
          } >> "$GITHUB_STEP_SUMMARY"
