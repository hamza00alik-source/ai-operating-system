[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencompany-aios"
version = "0.3.0"
description = "OpenCompany AIOS: a unified, human-supervised AI company operating system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "pydantic>=2.6,<3.0", "cryptography>=42,<47"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["opencompany_app*", "opencompany_core*"]
exclude = ["ai_os*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
# Exclude only the 11 historical tests that import the quarantined ai_os package.
# All independent OpenCompany tests retain normal pytest discovery.
addopts = "--ignore=tests/test_agent_runtime.py --ignore=tests/test_api.py --ignore=tests/test_brain.py --ignore=tests/test_business_ops.py --ignore=tests/test_credentials.py --ignore=tests/test_owner_session_auth.py --ignore=tests/test_provider_failover.py --ignore=tests/test_research_sources.py --ignore=tests/test_sessions_and_workforce.py --ignore=tests/test_website_api.py --ignore=tests/test_workflows.py"

[tool.vercel]
entrypoint = "src.opencompany_app.api:app"
